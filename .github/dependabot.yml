version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      react-runtime:
        patterns: [react, react-dom]
      vite-toolchain:
        patterns: [vite, esbuild]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
