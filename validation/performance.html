<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Browser capacity checks</title>
  <style>
    body {
      max-width: 1100px;
      margin: 30px auto;
      font: 16px/1.5 system-ui;
    }
    button {
      padding: 12px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    canvas {
      max-width: 100%;
    }
  </style>
  <h1>Browser capacity checks</h1>
  <p>
    Local, synthetic one-day benchmarks. No study storage or persistent visibility cache is read or
    written. Each solve has a 30-second timeout. This is a bounded capacity probe, not a crash test
    or independent scientific validation.
  </p>
  <button id="run">Run bounded benchmarks</button>
  <button id="stop" disabled>Stop</button>
  <button id="download" disabled>Download results</button>
  <p id="status" role="status">Ready</p>
  <div id="drawing"></div>
  <pre id="results"></pre>
  <script type="module" src="./performance.js"></script>
</html>
